name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-plugin:
    name: Validate plugin structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json paths
        run: |
          set -e
          errors=0
          while IFS= read -r path; do
            if [ ! -f "$path/SKILL.md" ]; then
              echo "::error::Missing $path/SKILL.md (referenced in plugin.json)"
              errors=$((errors + 1))
            fi
          done < <(jq -r '.skills[]' .claude-plugin/plugin.json)

          [ "$errors" -eq 0 ] && echo "✓ All plugin.json paths resolve to SKILL.md"
          exit "$errors"

      - name: Validate SKILL.md frontmatter
        run: |
          python3 << 'PY'
          import re, sys
          from pathlib import Path

          errors = []
          for skill in sorted(Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
              if not m:
                  errors.append(f"{skill}: missing or malformed YAML frontmatter")
                  continue
              fm = m.group(1)

              for field in ("name", "description", "model"):
                  if not re.search(rf"^{field}:", fm, re.MULTILINE):
                      errors.append(f"{skill}: missing '{field}' field")

              model_m = re.search(r"^model:\s*(\S+)", fm, re.MULTILINE)
              if model_m and model_m.group(1) not in {"opus", "sonnet", "haiku"}:
                  errors.append(
                      f"{skill}: invalid model '{model_m.group(1)}' "
                      "(must be opus/sonnet/haiku)"
                  )

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("✓ All SKILL.md frontmatter valid")
          PY

      - name: Verify skill count parity
        run: |
          plugin_count=$(jq '.skills | length' .claude-plugin/plugin.json)
          file_count=$(find skills -mindepth 2 -name SKILL.md | wc -l | tr -d " ")

          if [ "$plugin_count" != "$file_count" ]; then
            echo "::error::plugin.json lists $plugin_count skills but found $file_count SKILL.md files"
            exit 1
          fi
          echo "✓ Skill count matches: $plugin_count"

      - name: Reject stale bucket paths
        run: |
          if grep -rn "skills/\(shipping\|quality\|building\|meta\)/" \
               --include="*.md" --include="*.json" --include="*.yml" \
               --exclude-dir=.git \
               . ; then
            echo "::error::Stale bucket paths found (skills should be flat: skills/<name>/)"
            exit 1
          fi
          echo "✓ No stale bucket paths"

      - name: Validate agents
        run: |
          python3 << 'PY'
          import json, re, sys
          from pathlib import Path

          errors = []
          declared = json.loads(Path(".claude-plugin/plugin.json").read_text()).get("agents", [])
          for path in declared:
              f = Path(path)
              if not f.is_file():
                  errors.append(f"{path}: referenced in plugin.json but missing")
                  continue
              m = re.match(r"^---\n(.*?)\n---", f.read_text(encoding="utf-8"), re.DOTALL)
              if not m:
                  errors.append(f"{path}: missing or malformed YAML frontmatter")
                  continue
              fm = m.group(1)
              for field in ("name", "description", "tools", "model"):
                  if not re.search(rf"^{field}:", fm, re.MULTILINE):
                      errors.append(f"{path}: missing '{field}' field")
              tools = re.search(r"^tools:\s*(.+)$", fm, re.MULTILINE)
              if tools and re.search(r"\b(Edit|Write|NotebookEdit)\b", tools.group(1)):
                  errors.append(f"{path}: reviewer agents must be read-only (no Edit/Write)")

          on_disk = {f"./{p}" for p in map(str, Path("agents").glob("*.md"))}
          for missing in sorted(on_disk - set(declared)):
              errors.append(f"{missing}: agent file not registered in plugin.json")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"✓ {len(declared)} agent(s) valid and read-only")
          PY

      - name: Verify README skills table
        run: |
          expected=$(jq '.skills | length' .claude-plugin/plugin.json)
          readme_count=$(grep -cE '^\| \[`/' README.md || true)   # grep -c prints 0 itself on no match
          if [ "$readme_count" -ne "$expected" ]; then
            echo "::error::README Skills table has $readme_count rows (expected $expected)"
            exit 1
          fi
          echo "✓ README Skills table has $expected rows"
          badge=$(grep -oE 'badge/skills-[0-9]+' README.md | grep -oE '[0-9]+$' || true)
          if [ "$badge" != "$expected" ]; then
            echo "::error::README skills badge says '$badge' (expected $expected)"
            exit 1
          fi
          echo "✓ README skills badge says $expected"

      - name: Verify README diagrams exist
        run: |
          errors=0
          while IFS= read -r img; do
            if [ ! -f "$img" ]; then
              echo "::error::README references missing image $img"
              errors=$((errors + 1))
            fi
          done < <(grep -oE 'docs/assets/[A-Za-z0-9._-]+\.(png|svg)' README.md | sort -u)
          [ "$errors" -eq 0 ] && echo "✓ All README images exist"
          exit "$errors"
