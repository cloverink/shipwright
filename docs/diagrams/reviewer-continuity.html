<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reviewer continuity</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f5; }
    svg { display: block; width: 1240px; }
  </style>
</head>
<body>
<svg viewBox="0 0 1240 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reviewer-continuity-title reviewer-continuity-desc">
    <title id="reviewer-continuity-title">Reviewer continuity</title>
    <desc id="reviewer-continuity-desc">Rounds one to three reuse one Opus reviewer through SendMessage under an evidence rule; round four spawns a fresh reviewer as escalation, and a still-failing gate stops and reports.</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>
    <rect x="32" y="64" width="704" height="160" rx="8" fill="rgba(45,49,66,0.02)" stroke="#eb6c36" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="48" y="84" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ROUNDS 1–3 · ONE OPUS REVIEWER · CONTEXT KEPT</text>
    <line x1="240" y1="148" x2="292" y2="148" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="250" y="128" width="32" height="12" rx="2" fill="#f5f5f5"/>
    <text x="266" y="137" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FIX</text>
    <line x1="476" y1="148" x2="528" y2="148" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <rect x="486" y="128" width="32" height="12" rx="2" fill="#f5f5f5"/>
    <text x="502" y="137" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FIX</text>
    <line x1="712" y1="148" x2="784" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="740" y="128" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="760" y="137" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FAIL</text>
    <line x1="968" y1="148" x2="1016" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="972" y="128" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="992" y="137" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FAIL</text>
    <line x1="384" y1="184" x2="384" y2="264" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
    <line x1="620" y1="184" x2="620" y2="264" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
    <rect x="56" y="112" width="184" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="56" y="112" width="184" height="72" rx="6" fill="#ffffff" stroke="rgba(46,90,168,0.85)" stroke-width="1"/>
    <rect x="64" y="118" width="56" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.85)" stroke-opacity="0.55" stroke-width="0.8"/>
    <text x="92.0" y="127" fill="rgba(46,90,168,0.85)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROUND 1</text>
    <text x="148.0" y="150.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Spawn reviewer</text>
    <text x="148.0" y="165.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Agent · name: reviewer-code</text>
    <rect x="292" y="112" width="184" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="292" y="112" width="184" height="72" rx="6" fill="#ffffff" stroke="rgba(46,90,168,0.85)" stroke-width="1"/>
    <rect x="300" y="118" width="56" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.85)" stroke-opacity="0.55" stroke-width="0.8"/>
    <text x="328.0" y="127" fill="rgba(46,90,168,0.85)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROUND 2</text>
    <text x="384.0" y="150.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Re-review</text>
    <text x="384.0" y="165.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SendMessage · same agent</text>
    <rect x="528" y="112" width="184" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="528" y="112" width="184" height="72" rx="6" fill="#ffffff" stroke="rgba(46,90,168,0.85)" stroke-width="1"/>
    <rect x="536" y="118" width="56" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.85)" stroke-opacity="0.55" stroke-width="0.8"/>
    <text x="564.0" y="127" fill="rgba(46,90,168,0.85)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROUND 3</text>
    <text x="620.0" y="150.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Re-review</text>
    <text x="620.0" y="165.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SendMessage · same agent</text>
    <rect x="784" y="112" width="184" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="784" y="112" width="184" height="72" rx="6" fill="#ffffff" stroke="rgba(46,90,168,0.85)" stroke-width="1"/>
    <rect x="792" y="118" width="56" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.85)" stroke-opacity="0.55" stroke-width="0.8"/>
    <text x="820.0" y="127" fill="rgba(46,90,168,0.85)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ROUND 4</text>
    <text x="876.0" y="150.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Fresh reviewer</text>
    <text x="876.0" y="165.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">escalation · table + SHA</text>
    <rect x="1016" y="124" width="184" height="48" rx="24" fill="#f5f5f5"/>
    <rect x="1016" y="124" width="184" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="1108.0" y="145.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stop + report</text>
    <text x="1108.0" y="160.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">remaining findings</text>
    <rect x="292" y="264" width="420" height="120" rx="6" fill="#f5f5f5"/>
    <rect x="292" y="264" width="420" height="120" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="312" y="288" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">EVIDENCE RULE · EVERY CONTINUED ROUND</text>
    <text x="316" y="316" fill="#eb6c36" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">1</text>
    <text x="332" y="316" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif">Quote the post-fix line for each resolved finding</text>
    <text x="316" y="334" fill="#eb6c36" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">2</text>
    <text x="332" y="334" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif">Re-read every changed file, list line counts</text>
    <text x="316" y="352" fill="#eb6c36" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">3</text>
    <text x="332" y="352" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif">Name one regression check that was not a finding</text>
    <text x="316" y="370" fill="#eb6c36" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">4</text>
    <text x="332" y="370" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif">Re-score from scratch, never carry it forward</text>
    <text x="56" y="280" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">A fresh reviewer every</text>
    <text x="56" y="300" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">round cold-starts and</text>
    <text x="56" y="320" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">samples new nits, so</text>
    <text x="56" y="340" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">the score oscillates.</text>
    <text x="784" y="280" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">Same reviewer = faster</text>
    <text x="784" y="300" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">re-checks and one stable</text>
    <text x="784" y="320" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">bar. Any round that passes</text>
    <text x="784" y="340" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', Georgia, serif" text-anchor="start">the gate exits early.</text>
    <line x1="32" y1="412" x2="1208" y2="412" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
    <text x="32" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="108" y="428" width="36" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.85)" stroke-opacity="0.55" stroke-width="0.8"/>
    <text x="126.0" y="437" fill="rgba(46,90,168,0.85)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OPUS</text>
    <text x="156" y="437" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">code-reviewer agent</text>
    <line x1="291" y1="434" x2="319" y2="434" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="327" y="437" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">continued via SendMessage</text>
    <line x1="492" y1="434" x2="520" y2="434" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="528" y="437" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">escalate / stop</text>
    <line x1="643" y1="434" x2="671" y2="434" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="679" y="437" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">rule applies</text>
</svg>
</body>
</html>
